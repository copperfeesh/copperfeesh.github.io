<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | Garron Stevenson</title>
    <meta name="description" content="{{description}}">
    <meta name="author" content="Garron Stevenson">
    <link rel="canonical" href="{{canonical_url}}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Garron Stevenson">
    <meta property="og:url" content="{{canonical_url}}">
    <meta property="og:title" content="{{title}} | Garron Stevenson">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="https://copperfish.net/assets/favicon.svg">
    <meta property="article:published_time" content="{{iso_date}}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{title}} | Garron Stevenson">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="https://copperfish.net/assets/favicon.svg">

    <!-- Favicon & Feed -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="alternate" type="application/rss+xml" title="Garron Stevenson (RSS Feed)" href="../feed.xml">

    <!-- Prevent Theme Flash -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <div class="layout">
        {{sidebar}}
        <main class="content">
            <article class="post-content">
                <a href="../index.html" class="back-link">← Back to Blog</a>
                <header class="post-header">
                    <time class="post-date">{{formatted_date}}</time>
                    <h1 class="post-title">{{title}}</h1>
                </header>
                <div class="post-body">
                    {{content}}
                </div>
            </article>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
    <script src="../assets/theme.js"></script>
</body>
</html>
